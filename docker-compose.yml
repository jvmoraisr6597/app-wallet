version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - laravel

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8
    container_name: db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  node:
    image: node:20
    container_name: laravel_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173" # <-- Porta Vite
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - laravel
  
  redis:
    image: redis:alpine
    container_name: laravel-redis
    ports:
      - 6379:6379
    networks:
      - laravel


  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - laravel
  
  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: laravel_python
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    depends_on:
      - redis
    networks:
      - laravel


volumes:
  dbdata:

networks:
  laravel:
    driver: bridge
